name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-windows:
    name: Тесты (Windows, полный набор)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Запуск тестов
        run: pytest -q --cov=. --cov-report=term-missing

  core-linux:
    name: Ядро и аналитика (Linux, без GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка минимальных зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pytest psutil Pillow

      - name: Проверка импорта ядра без Windows-модулей
        run: python -c "import database, settings, tracker, utils, logging_setup; print('core imports OK')"

      - name: Тесты базы данных, настроек и новой аналитики
        run: >
          pytest -q
          tests/test_database.py
          tests/test_settings.py
          tests/test_new_features.py
          tests/test_utils_and_paths.py

  lint:
    name: Линтер (ruff)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
