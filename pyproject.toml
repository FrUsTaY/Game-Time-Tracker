[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gametimetracker"
version = "1.4.0"
description = "Лёгкий трекер игрового времени для Windows с системным треем и аналитикой"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "FrUsTaY" }]
keywords = ["game", "tracker", "time", "windows", "tray", "statistics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]

dependencies = [
    "customtkinter>=5.2.0",
    "psutil>=5.9.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "plyer>=2.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/FrUsTaY/Game-Time-Tracker"
Repository = "https://github.com/FrUsTaY/Game-Time-Tracker"
Issues = "https://github.com/FrUsTaY/Game-Time-Tracker/issues"

[project.scripts]
gametimetracker = "main:main"

[tool.setuptools]
py-modules = [
    "app",
    "build",
    "database",
    "digest",
    "generate_icon",
    "logging_setup",
    "main",
    "settings",
    "tracker",
    "tray",
    "utils",
]

[tool.setuptools.packages.find]
include = ["ui*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = [".", "ui"]
omit = ["tests/*", "build.py", "generate_icon.py"]

[tool.ruff]
line-length = 110
target-version = "py38"
exclude = ["build", "dist", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # длина строк контролируется вручную (русские строки/подсказки)
]
